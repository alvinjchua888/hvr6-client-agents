version: '3.8'

services:
  hvr6-agents:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=3001
      - HVR_API_BASE_URL=${HVR_API_BASE_URL:-http://localhost:4340}
      - HVR_API_USERNAME=${HVR_API_USERNAME:-admin}
      - HVR_API_PASSWORD=${HVR_API_PASSWORD:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
